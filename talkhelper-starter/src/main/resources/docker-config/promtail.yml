server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 采集 TalkHelper 应用的 JSON 日志
  - job_name: talkhelper-json
    static_configs:
      - targets:
          - localhost
        labels:
          job: talkhelper
          service: talkhelper
          __path__: /var/log/talkhelper/talkhelper-json.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: traceId
            spanId: spanId
            logger: logger
      - labels:
          level:
          traceId:
          logger:

  # 采集 Docker 容器 stdout 日志（备选）
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{job="docker"}'
          stages:
            - json:
                expressions:
                  stream: stream
                  tag: attrs.tag
            - labels:
                stream:
