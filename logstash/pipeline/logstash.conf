input {
  # Filebeat输入（推荐）
  beats {
    port => 5044
  }
  
  # 也可以直接接收TCP日志
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # 解析Spring Boot日志格式
  if [logger_name] =~ /^com\.talkhelper/ {
    mutate {
      add_tag => ["talkhelper"]
    }
  }
  
  # 添加时间戳
  date {
    match => ["timestamp", "ISO8601"]
  }
  
  # 解析异常堆栈
  if [stack_trace] {
    mutate {
      add_field => { "has_exception" => "true" }
    }
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "talkhelper-logs-%{+YYYY.MM.dd}"
  }
  
  # 调试输出（可选）
  # stdout { codec => rubydebug }
}
