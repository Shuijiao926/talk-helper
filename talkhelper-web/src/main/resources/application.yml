# ==================== 应用基础配置（固定不变）====================

spring:
  application:
    name: talkhelper
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  profiles:
    active: local
  # Spring AI Alibaba DashScope配置
  ai:
    dashscope:
      api-key: sk-5355539b05fc43c598e03cf05fc47117
      base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
      chat:
        options:
          model: qwen3.6-plus

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000

# Actuator监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# 业务配置
talkhelper:
  # 消息队列配置
  mq:
    type: redis  # 可选: redis, rabbitmq, kafka, rocketmq
  # LLM配置
  llm:
    provider: dashscope  # 可选: dashscope, openai, claude
  # 对象存储通用配置
  storage:
    default-bucket: talkhelper
    active-type: minio  # 可选: minio, local, s3
    # MinIO专用配置
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket-name: talkhelper

# 日志配置
logging:
  level:
    root: INFO
    com.talkhelper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/talkhelper.log
    max-size: 100MB
    max-history: 30
