services:

  # ═══════════════════════════════════════════════════════════════════════
  # 业务基础设施
  # ═══════════════════════════════════════════════════════════════════════

  # Redis - 任务队列和缓存
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:8.4.0-alpine
    container_name: talkhelper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass talkhelper123
    networks:
      - talkhelper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "talkhelper123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL - 业务数据
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql/mysql-server:8.0
    container_name: talkhelper-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: talk_helper
      MYSQL_USER: talkhelper
      MYSQL_PASSWORD: talkhelper123
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - talkhelper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - 对象存储
  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: talkhelper-minio
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - talkhelper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════
  # 消息队列 (RocketMQ)
  # ═══════════════════════════════════════════════════════════════════════

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/rocketmq:5.3.2
    container_name: talkhelper-rocketmq-namesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT: "-server -Xms256m -Xmx256m"
    command: sh mqnamesrv
    networks:
      - talkhelper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ Broker
  rocketmq-broker:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/rocketmq:5.3.2
    container_name: talkhelper-rocketmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 autoCreateTopicEnable=true
    networks:
      - talkhelper-network
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy

#  # RocketMQ Dashboard
#  rocketmq-dashboard:
#    image: apache/rocketmq-dashboard:latest
#    container_name: talkhelper-rocketmq-dashboard
#    ports:
#      - "8180:8080"
#    environment:
#      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
#    networks:
#      - talkhelper-network
#    restart: unless-stopped
#    depends_on:
#      - rocketmq-namesrv

  # ═══════════════════════════════════════════════════════════════════════
  # 可观测基础设施
  # ═══════════════════════════════════════════════════════════════════════

  # Prometheus - 指标采集
  prometheus:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/prom/prometheus:v2.52.0
    container_name: talkhelper-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    networks:
      - talkhelper-network
    restart: unless-stopped

  # Tempo - 分布式链路追踪存储 (接收 OTLP Trace)
  tempo:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/ghcr.io/grafana/tempo-operator/tempo-operator:v0.15.3
    container_name: talkhelper-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo API (查询)
      - "4317:4317"   # OTel gRPC (接收 Trace)
      - "4318:4318"   # OTel HTTP (接收 Trace)
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    networks:
      - talkhelper-network
    restart: unless-stopped

  # Loki - 日志聚合存储
  loki:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/grafana/loki:latest
    container_name: talkhelper-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - talkhelper-network
    restart: unless-stopped

  # Grafana - 统一可视化
  grafana:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/devtron/grafana:7.3.1
    container_name: talkhelper-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml
    networks:
      - talkhelper-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki

  # ═══════════════════════════════════════════════════════════════════════
  # 应用服务
  # ═══════════════════════════════════════════════════════════════════════

  # TalkHelper 应用
  talkhelper-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talkhelper-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-javaagent:/app/otel-agent.jar -Xms512m -Xmx1024m"
      # OTel 配置
      OTEL_SERVICE_NAME: talk-helper
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=roaming-guide,service.version=1.0.0"
      OTEL_TRACES_SAMPLER: always_on
      # 敏感信息从 .env 文件读取
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    volumes:
      - app-logs:/app/logs
    networks:
      - talkhelper-network
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  redis-data:
    driver: local
  mysql-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  tempo-data:
    driver: local
  loki-data:
    driver: local
  app-logs:
    driver: local

networks:
  talkhelper-network:
    driver: bridge